<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Tiny Treasures — cute and colourful baby essentials in Nigeria.">
  <title>Tiny Treasures | Baby Store</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <section class="page-hero">
    <div class="container">
      <span class="eyebrow">We're happy to help</span>
      <h1 class="page-title">Say hello</h1>
      <p>Questions about a product or an order? Send us a message.</p>
    </div>
  </section>
  <main class="container">
    <form id="contact-form" class="form-card">
      <div class="form-group"><label>Your name</label><input class="field" name="name" required></div>
      <div class="form-group" style="margin-top:14px"><label>Email or phone</label><input class="field" name="contact" required></div>
      <div class="form-group" style="margin-top:14px"><label>Message</label><textarea class="field" name="message" rows="5" required></textarea></div>
      <button class="btn pink" style="margin-top:18px">Send via WhatsApp</button>
    </form>
  </main>
  <script src="js/app.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
