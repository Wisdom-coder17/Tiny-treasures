<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Tiny Treasures — cute and colourful baby essentials in Nigeria.">
    <title>Tiny Treasures | Baby Store</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <section class="page-hero">
        <div class="container"><span class="eyebrow">Almost yours</span>
            <h1 class="page-title">Checkout</h1>
            <p>Share your delivery details to send your order on WhatsApp.</p>
        </div>
    </section>
    <main class="container">
        <form id="checkout-form" class="form-card">
            <h2 class="page-title" style="font-size:24px">Delivery details</h2>
            <div class="form-grid">
                <div class="form-group"><label>Full name *</label><input class="field" name="name" required></div>
                <div class="form-group"><label>Phone number *</label><input class="field" name="phone" required></div>
                <div class="form-group full"><label>Email address</label><input class="field" type="email" name="email">
                </div>
                <div class="form-group full"><label>Delivery address *</label><textarea class="field" name="address"
                        rows="3" required></textarea></div>
                <div class="form-group"><label>City *</label><input class="field" name="city" required></div>
                <div class="form-group"><label>State *</label><input class="field" name="state" required></div>
                <div class="form-group full"><label>Order note (optional)</label><textarea class="field" name="note"
                        rows="2"></textarea></div>
            </div>
            <div id="checkout-total" style="margin:22px 0;font-weight:900"></div><button class="btn pink"
                type="submit">Send order on WhatsApp →</button>
            <p class="muted" style="font-size:12px">Your WhatsApp app will open with your order details. Payment and
                delivery arrangements are confirmed directly with the store.</p>
        </form>
    </main>
    <script src="js/app.js"></script>
    <script src="js/checkout.js"></script>
</body>

</html>
